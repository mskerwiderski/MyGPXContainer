# Lint, tests, image builds and a secret scan on every push; on a version tag
# (v1.2.3) also the images of the app and the routing service for amd64 and
# arm64 to GitHub's container registry (ghcr.io/<owner>/mygpxcontainer[-routing]).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff, rules pinned in pyproject.toml)
        run: |
          ruff check app tests routing
          echo "ruff: checked app/, tests/ and routing/"
      - name: Tests
        run: |
          pytest -v 2>&1 | tee pytest.log
          grep -E "[0-9]+ passed" pytest.log || (echo "no test run found in log" && exit 1)
          ! grep -E "[0-9]+ (failed|error)" pytest.log

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: |
          docker build -t mygpxcontainer:ci .
          docker image inspect mygpxcontainer:ci --format 'built mygpxcontainer:ci, {{.Size}} bytes'
      - name: Smoke-check image
        run: |
          docker run --rm mygpxcontainer:ci python -c "import app.main; print('app imports ok')"
          # the elevation tiles: rasterio must load inside the image (system libs)
          docker run --rm mygpxcontainer:ci python -c "import rasterio._io; print('rasterio ok')"
      - name: Build routing image
        run: |
          docker build -t mygpxcontainer-routing:ci routing
          docker run --rm --entrypoint sh mygpxcontainer-routing:ci -c \
            "java -version 2>&1 | head -1 && osmium --version | head -1 && python3 -c 'import ast; ast.parse(open(\"/app/run.py\").read())' && echo routing image ok"

  # The way a stranger starts it (README, way A): the generic compose file,
  # .env from .env.example, mode single - then the first-start page with the
  # setup code from the log, and signed in after it.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start as in the README
        run: |
          cp .env.example .env
          docker compose up -d --build mygpxcontainer
          for i in $(seq 60); do curl -fs localhost:8000/healthz && break; sleep 2; done
          curl -fs localhost:8000/healthz
      - name: First start - setup page, setup code from the log, signed in
        run: |
          test "$(curl -s -o /dev/null -w '%{redirect_url}' localhost:8000/)" = "http://localhost:8000/setup"
          code=$(docker compose logs mygpxcontainer | grep -o 'setup code [0-9a-f]*' | awk '{print $3}')
          test -n "$code"
          curl -s -c jar -o /dev/null -w '%{http_code}' -X POST localhost:8000/setup \
            -d "code=$code&username=ci&display_name=CI&password=correct-horse-battery&again=correct-horse-battery" | grep -q 303
          curl -s -b jar -o /dev/null -w '%{http_code}' localhost:8000/ | grep -q 200
          curl -s -D - -o /dev/null localhost:8000/healthz | grep -qi content-security-policy
          echo "compose smoke test ok"
      - name: Logs
        if: failure()
        run: docker compose logs

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, docker, compose, gitleaks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: mygpxcontainer
            context: .
          - name: mygpxcontainer-routing
            context: routing
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
