# Lint, tests, image builds and a secret scan on every push; on a version tag
# (v1.2.3) also the images of the app and the routing service for amd64 and
# arm64 to GitHub's container registry (ghcr.io/<owner>/mygpxcontainer[-routing]).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff, rules pinned in pyproject.toml)
        run: |
          ruff check app tests routing
          echo "ruff: checked app/, tests/ and routing/"
      - name: Tests
        run: |
          pytest -v 2>&1 | tee pytest.log
          grep -E "[0-9]+ passed" pytest.log || (echo "no test run found in log" && exit 1)
          ! grep -E "[0-9]+ (failed|error)" pytest.log

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build -t mygpxcontainer:ci .
          docker image inspect mygpxcontainer:ci --format 'built mygpxcontainer:ci, {{.Size}} bytes'
      - name: Smoke-check image
        run: |
          docker run --rm mygpxcontainer:ci python -c "import app.main; print('app imports ok')"
      - name: Build routing image
        run: |
          docker build -t mygpxcontainer-routing:ci routing
          docker run --rm --entrypoint sh mygpxcontainer-routing:ci -c \
            "java -version 2>&1 | head -1 && osmium --version | head -1 && python3 -c 'import ast; ast.parse(open(\"/app/run.py\").read())' && echo routing image ok"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, docker, gitleaks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: mygpxcontainer
            context: .
          - name: mygpxcontainer-routing
            context: routing
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
