{% from "_auth_page.html" import auth_page with context %}
{% call auth_page(_("Welcome")) %}
<p class="muted">{{ _("Set a password for “{name}”, then you are in.", name=invited.username) }}</p>
{% if problem %}<p class="flash flash-error">{{ _(problem) }}</p>{% endif %}
<form method="post" action="/invite/{{ token }}" class="stack">
  <input type="hidden" name="username" value="{{ invited.username }}" autocomplete="username">
  <label for="password">{{ _("Password") }}</label>
  <input id="password" type="password" name="password" autocomplete="new-password" minlength="10" required autofocus>
  <label for="again">{{ _("Password again") }}</label>
  <input id="again" type="password" name="again" autocomplete="new-password" minlength="10" required>
  <div class="actions"><button type="submit">{{ _("Set password") }}</button></div>
</form>
{% endcall %}
