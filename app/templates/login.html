{% from "_auth_page.html" import auth_page with context %}
{% call auth_page(_("Sign in")) %}
{% if problem %}<p class="flash flash-error">{{ _(problem) }}</p>{% endif %}
<form method="post" action="/login" class="stack">
  <input type="hidden" name="next" value="{{ next }}">
  <label for="username">{{ _("User name") }}</label>
  <input id="username" name="username" value="{{ username or '' }}" autocomplete="username" autocapitalize="none" required autofocus>
  <label for="password">{{ _("Password") }}</label>
  <input id="password" type="password" name="password" autocomplete="current-password" required>
  <div class="actions"><button type="submit">{{ _("Sign in") }}</button></div>
</form>
{% endcall %}
